name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan changed history for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE}..${PR_HEAD}"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="$GITHUB_SHA"
          else
            log_opts="${BEFORE_SHA}..${GITHUB_SHA}"
          fi
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source . --redact --no-banner --log-opts="$log_opts"
      - name: Deterministic Linux verification and PostgreSQL 18 restore
        run: python3 scripts/verify.py --postgres 18
      - name: Retain sanitized verification summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-summary
          path: .artifacts/verification/*/summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
