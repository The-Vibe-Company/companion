name: "Diagnostic: iOS Live E2E"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-e2e
  cancel-in-progress: false

jobs:
  native-companion:
    name: Native Companion with Box and z.ai
    runs-on: macos-15
    environment: ios-e2e
    timeout-minutes: 40
    env:
      CONDUCTOR_IS_LOCAL: "1"
      CONDUCTOR_PORT: "3000"
      COMPANION_DEV_SKIP_ENV_FILE: "1"
      COMPANION_DEV_BOX_SIM_ENABLED: "false"
      COMPANION_COMPANIONS_ENABLED: "true"
      COMPANION_COMPANIONS_ALLOWED_EMAIL_DOMAINS: thevibecompany.co
      COMPANION_BOX_API_KEY: ${{ secrets.COMPANION_BOX_E2E_API_KEY }}
      COMPANION_BOX_E2E_ZAI_API_KEY: ${{ secrets.COMPANION_BOX_E2E_ZAI_API_KEY }}
      COMPANION_PI_INSTALL_COMMAND: ${{ secrets.COMPANION_PI_INSTALL_COMMAND }}
      COMPANION_IOS_E2E_API_URL: ${{ vars.COMPANION_IOS_E2E_API_URL }}
      COMPANION_IOS_E2E_EMAIL: ${{ vars.COMPANION_IOS_E2E_EMAIL }}
      COMPANION_IOS_E2E_PASSWORD: ${{ secrets.COMPANION_IOS_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install native dependencies
        run: |
          brew install postgresql@17
          pnpm install --frozen-lockfile

      - name: Start the isolated Companion stack
        id: stack
        run: |
          mkdir -p .context/ios-e2e
          bash scripts/dev-conductor.sh > .context/ios-e2e/stack.log 2>&1 &
          stack_pid=$!
          echo "pid=$stack_pid" >> "$GITHUB_OUTPUT"
          for readiness_attempt in $(seq 1 180); do
            if curl --fail --silent "$COMPANION_IOS_E2E_API_URL/healthz" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$stack_pid" 2>/dev/null; then
              echo "Companion stack exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Companion stack did not become healthy after $readiness_attempt attempts" >&2
          exit 1

      - name: Connect z.ai and create the E2E Companion
        run: node scripts/ios-e2e-fixture.mjs prepare

      - name: Exercise login, roster, send, Box, Pi, and z.ai reply
        run: swift test --package-path apps/ios/CompanionKit

      - name: Remove the E2E Companion and its Box
        if: always() && steps.stack.outputs.pid != ''
        run: node scripts/ios-e2e-fixture.mjs cleanup

      - name: Stop the isolated Companion stack
        if: always() && steps.stack.outputs.pid != ''
        run: |
          kill -HUP "${{ steps.stack.outputs.pid }}" 2>/dev/null || true
          wait "${{ steps.stack.outputs.pid }}" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-diagnostics
          path: .context/ios-e2e/stack.log
          if-no-files-found: ignore
