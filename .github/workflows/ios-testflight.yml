name: "Release: iOS TestFlight"

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release-scope:
    name: Select a CI-approved iOS commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
      release_sha: ${{ steps.scope.outputs.release_sha }}
    steps:
      - name: Download the CI-approved push range
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-testflight-scope
          path: ${{ runner.temp }}/ios-testflight-scope
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout the CI-approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect native iOS changes
        id: scope
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTFLIGHT_BEFORE_SHA_FILE: ${{ runner.temp }}/ios-testflight-scope/before-sha
          TESTFLIGHT_RELEASE_SHA_FILE: ${{ runner.temp }}/ios-testflight-scope/release-sha
        run: node scripts/ios-testflight-scope.mjs

  upload:
    name: Archive and upload native iOS
    needs: release-scope
    if: needs.release-scope.outputs.ios == 'true'
    runs-on: macos-26
    environment: ios-testflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release-scope.outputs.release_sha }}

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "$sdk_version" != 26.* ]]; then
            echo "Expected the iPhoneOS 26 SDK, got $sdk_version" >&2
            exit 1
          fi

      - name: Install distribution signing assets
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_NOTIFICATION_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.IOS_NOTIFICATION_EXTENSION_PROVISIONING_PROFILE }}
        run: |
          keychain_path="$RUNNER_TEMP/companion-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/companion-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_manifest="$RUNNER_TEMP/companion-signing-profile-paths"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$certificate_path"
          mkdir -p "$profile_dir"
          : > "$profile_manifest"
          install_profile() {
            encoded_profile="$1"
            label="$2"
            temporary_profile="$RUNNER_TEMP/$label.mobileprovision"
            printf '%s' "$encoded_profile" | base64 --decode > "$temporary_profile"
            profile_uuid="$(security cms -D -i "$temporary_profile" | plutil -extract UUID raw -o - -)"
            if [[ ! "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              echo "Invalid provisioning profile UUID for $label" >&2
              exit 1
            fi
            installed_profile="$profile_dir/$profile_uuid.mobileprovision"
            mv "$temporary_profile" "$installed_profile"
            printf '%s\n' "$installed_profile" >> "$profile_manifest"
          }
          install_profile "$IOS_PROVISIONING_PROFILE" companion-app
          install_profile "$IOS_NOTIFICATION_EXTENSION_PROVISIONING_PROFILE" companion-notification-extension

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: Companion Native App Store 2026-08-24
          IOS_NOTIFICATION_EXTENSION_PROVISIONING_PROFILE_SPECIFIER: Companion Notification Service App Store 2026-08-26
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/companion-ios-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash apps/ios/scripts/release.sh

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/companion-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/companion-distribution.p12"
          profile_manifest="$RUNNER_TEMP/companion-signing-profile-paths"
          if [[ -f "$profile_manifest" ]]; then
            while IFS= read -r installed_profile; do
              case "$installed_profile" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                  rm -f -- "$installed_profile"
                  ;;
              esac
            done < "$profile_manifest"
            rm -f "$profile_manifest"
          fi

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-diagnostics
          path: ${{ runner.temp }}/companion-ios-release-*/**/*.log
          if-no-files-found: ignore
