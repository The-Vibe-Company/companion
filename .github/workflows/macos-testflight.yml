name: "Release: macOS TestFlight"

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-testflight
  cancel-in-progress: false

jobs:
  release-scope:
    name: Select a CI-approved macOS commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
      release_sha: ${{ steps.scope.outputs.release_sha }}
    steps:
      - name: Download the CI-approved push range
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-testflight-scope
          path: ${{ runner.temp }}/macos-testflight-scope
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout the CI-approved commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect native macOS changes
        id: scope
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTFLIGHT_BEFORE_SHA_FILE: ${{ runner.temp }}/macos-testflight-scope/before-sha
          TESTFLIGHT_RELEASE_SHA_FILE: ${{ runner.temp }}/macos-testflight-scope/release-sha
        run: node scripts/macos-testflight-scope.mjs

  upload:
    name: Archive and upload native macOS
    needs: release-scope
    if: needs.release-scope.outputs.macos == 'true'
    runs-on: macos-26
    environment: macos-testflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-scope.outputs.release_sha }}

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "$sdk_version" != 26.* ]]; then
            echo "Expected the macOS 26 SDK, got $sdk_version" >&2
            exit 1
          fi

      - name: Install distribution signing assets
        env:
          MACOS_DISTRIBUTION_P12: ${{ secrets.MACOS_DISTRIBUTION_P12 }}
          MACOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MACOS_DISTRIBUTION_P12_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/companion-macos-signing.keychain-db"
          distribution_path="$RUNNER_TEMP/companion-macos-distribution.p12"
          installer_path="$RUNNER_TEMP/companion-macos-installer.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_manifest="$RUNNER_TEMP/companion-macos-signing-profile-paths"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_DISTRIBUTION_P12" | base64 --decode > "$distribution_path"
          printf '%s' "$MACOS_INSTALLER_P12" | base64 --decode > "$installer_path"
          temporary_profile="$RUNNER_TEMP/companion-macos.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$temporary_profile"
          profile_uuid="$(security cms -D -i "$temporary_profile" | plutil -extract UUID raw -o - -)"
          if [[ ! "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "Invalid macOS provisioning profile UUID" >&2
            exit 1
          fi
          mkdir -p "$profile_dir"
          installed_profile="$profile_dir/$profile_uuid.provisionprofile"
          mv "$temporary_profile" "$installed_profile"
          printf '%s\n' "$installed_profile" > "$profile_manifest"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$distribution_path" -P "$MACOS_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security import "$installer_path" -P "$MACOS_INSTALLER_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MACOS_PROVISIONING_PROFILE_SPECIFIER: Companion macOS App Store 2026-09-01
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/companion-macos-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash apps/macos/scripts/release.sh

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/companion-macos-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/companion-macos-distribution.p12" "$RUNNER_TEMP/companion-macos-installer.p12"
          profile_manifest="$RUNNER_TEMP/companion-macos-signing-profile-paths"
          if [[ -f "$profile_manifest" ]]; then
            while IFS= read -r installed_profile; do
              case "$installed_profile" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile)
                  rm -f -- "$installed_profile"
                  ;;
              esac
            done < "$profile_manifest"
            rm -f "$profile_manifest"
          fi

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-testflight-diagnostics
          path: ${{ runner.temp }}/companion-macos-release-*/**/*.log
          if-no-files-found: ignore
