name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Check coverage floor
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ {
            gsub("%", "", $3)
            if (($3 + 0) < 55) {
              printf("coverage %.1f%% is below required 55.0%%\n", $3)
              exit 1
            }
          }'

      - name: Validate shell scripts
        run: |
          sh -n install.sh
          bash -n install.sh bin/start-on-fly bin/run-hermes-process bin/start-open-webui-on-fly bin/start-dashboard-on-fly

      - name: Verify installable CLI package
        run: |
          set -euo pipefail
          bin_dir="$(mktemp -d)"
          GOBIN="$bin_dir" go install ./cmd/companion
          "$bin_dir/companion" version

      - name: Validate sample workspace
        run: |
          go run ./cmd/companion validate --workspace examples/minimal
          go run ./cmd/companion validate --workspace examples/webui

      - name: Build Hermes Docker image
        run: docker build -f Dockerfile .

      - name: Build Open WebUI Docker image
        run: docker build -f Dockerfile.open-webui .

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ci-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X github.com/The-Vibe-Company/companion/internal/version.Version=${VERSION}" \
            -o dist/companion \
            ./cmd/companion
          tar -C dist -czf "dist/companion_${GOOS}_${GOARCH}.tar.gz" companion
          sha256sum "dist/companion_${GOOS}_${GOARCH}.tar.gz" > "dist/companion_${GOOS}_${GOARCH}.tar.gz.sha256"
