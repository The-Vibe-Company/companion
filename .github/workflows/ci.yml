name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://companion:companion@127.0.0.1:5432/companion
  DATABASE_MIGRATION_URL: postgres://companion:companion@127.0.0.1:5432/companion
  DATABASE_API_URL: postgres://companion_api:companion-api@127.0.0.1:5432/companion
  DATABASE_WORKER_URL: postgres://companion_worker:companion-worker@127.0.0.1:5432/companion
  DATABASE_COMPANION_RUNTIME_URL: postgres://companion_runtime_v2:companion-runtime-v2@127.0.0.1:5432/companion
  DATABASE_API_ROLE: companion_api
  DATABASE_WORKER_ROLE: companion_worker
  DATABASE_COMPANION_RUNTIME_ROLE: companion_runtime_v2

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      design: ${{ steps.scope.outputs.design }}
      quality: ${{ steps.scope.outputs.quality }}
      build: ${{ steps.scope.outputs.build }}
      database: ${{ steps.scope.outputs.database }}
      browser: ${{ steps.scope.outputs.browser }}
      containers: ${{ steps.scope.outputs.containers }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      skill: ${{ steps.scope.outputs.skill }}
      ios: ${{ steps.scope.outputs.ios }}
      macos: ${{ steps.scope.outputs.macos }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify change risk
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci-scope.mjs
          --event "$EVENT_NAME"
          --base "${BASE_SHA:-$GITHUB_SHA}"
          --head "${HEAD_SHA:-$GITHUB_SHA}"
          --github-output "$GITHUB_OUTPUT"

      - name: Record the approved main push range
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scope_dir="$RUNNER_TEMP/ios-testflight-scope"
          mkdir -p "$scope_dir"
          printf '%s\n' "$BEFORE_SHA" > "$scope_dir/before-sha"
          printf '%s\n' "$RELEASE_SHA" > "$scope_dir/release-sha"

      - name: Upload the approved main push range
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-testflight-scope
          path: ${{ runner.temp }}/ios-testflight-scope
          if-no-files-found: error
          retention-days: 1

      - name: Upload the approved main push range for macOS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-testflight-scope
          path: ${{ runner.temp }}/ios-testflight-scope
          if-no-files-found: error
          retention-days: 1

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    needs: scope
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Test CI scope classifier and local verifier
        run: node --test scripts/agent-browser-box-center.test.mjs scripts/companions-env-defaults.test.mjs scripts/railway-config.test.mjs scripts/ci-scope.test.mjs scripts/ci-playwright-policy.test.mjs scripts/ci-gate.test.mjs scripts/ios-devx.test.mjs scripts/macos-devx.test.mjs scripts/ios-release.test.mjs scripts/macos-release.test.mjs scripts/ios-e2e-fixture.test.mjs scripts/ios-local-live.test.mjs scripts/lint-anti-slop.test.mjs scripts/verify-change.test.mjs

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Validate shell scripts
        run: git ls-files -z '*.sh' ':!.agents/skills/**' ':!.claude/skills/**' | xargs -0 shellcheck

      - name: Validate development stack scripts
        run: bash scripts/dev-stack-check.sh

      - name: Scan changed history for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) log_opts="${PR_BASE}..${PR_HEAD}" ;;
            merge_group) log_opts="${MERGE_BASE}..${GITHUB_SHA}" ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then log_opts="${GITHUB_SHA}^..${GITHUB_SHA}"; else log_opts="${BEFORE_SHA}..${GITHUB_SHA}"; fi
              ;;
            *) log_opts="${GITHUB_SHA}^..${GITHUB_SHA}" ;;
          esac
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source . --redact --no-banner --log-opts="$log_opts"

      - name: Set up pnpm
        if: needs.scope.outputs.skill == 'true' || needs.scope.outputs.design == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        if: needs.scope.outputs.skill == 'true' || needs.scope.outputs.design == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check bundled Companion skill version
        if: needs.scope.outputs.skill == 'true'
        run: pnpm --filter @companion/companion-skill check:version-bump

      - name: Set up Python
        if: needs.scope.outputs.skill == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test bundled Companion skill guards
        if: needs.scope.outputs.skill == 'true'
        run: bash scripts/run-skill-guards.sh

      - name: Validate DESIGN.md
        if: needs.scope.outputs.design == 'true'
        run: pnpm design:lint

  apple-quality:
    name: Apple Quality
    runs-on: macos-26
    needs: scope
    if: needs.scope.outputs.skill == 'true' || needs.scope.outputs.ios == 'true' || needs.scope.outputs.macos == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        if: needs.scope.outputs.skill == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # This is the only Darwin-specific non-iOS signal in the job: anonymous-pipe
      # permissions differ from Linux and protect the private secret transport contract.
      - name: Test bundled Companion skill guards
        if: needs.scope.outputs.skill == 'true'
        run: bash scripts/run-skill-guards.sh

      - name: Test CompanionKit
        if: needs.scope.outputs.ios != needs.scope.outputs.macos
        run: swift test --package-path apps/ios/CompanionKit

      - name: Build native app
        if: needs.scope.outputs.ios == 'true' && needs.scope.outputs.macos != 'true'
        run: >-
          xcodebuild build
          -workspace apps/ios/Companion.xcworkspace
          -scheme Companion
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/companion-derived-data"
          CODE_SIGNING_ALLOWED=NO

      - name: Test native Mac app
        if: needs.scope.outputs.macos == 'true' && needs.scope.outputs.ios != 'true'
        run: >-
          xcodebuild test
          -workspace apps/ios/Companion.xcworkspace
          -scheme CompanionMac
          -configuration Debug
          -destination "platform=macOS"
          -derivedDataPath "$RUNNER_TEMP/companion-mac-derived-data"
          CODE_SIGNING_ALLOWED=NO

      # Shared changes exercise CompanionKit and both native clients. Keep all three signals inside
      # the same capped Apple job, with at most two compilers contending for the runner at once.
      - name: Validate native apps
        if: needs.scope.outputs.ios == 'true' && needs.scope.outputs.macos == 'true'
        shell: bash
        run: |
          swift test --package-path apps/ios/CompanionKit &
          companion_kit_pid=$!

          xcodebuild build \
            -quiet \
            -workspace apps/ios/Companion.xcworkspace \
            -scheme Companion \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/companion-derived-data" \
            CODE_SIGNING_ALLOWED=NO &
          ios_pid=$!

          if wait "$companion_kit_pid"; then companion_kit_status=0; else companion_kit_status=$?; fi

          xcodebuild test \
            -quiet \
            -workspace apps/ios/Companion.xcworkspace \
            -scheme CompanionMac \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/companion-mac-derived-data" \
            CODE_SIGNING_ALLOWED=NO &
          macos_pid=$!

          if wait "$ios_pid"; then ios_status=0; else ios_status=$?; fi
          if wait "$macos_pid"; then macos_status=0; else macos_status=$?; fi
          if (( companion_kit_status != 0 || ios_status != 0 || macos_status != 0 )); then exit 1; fi

  quality:
    name: Quality Node 22
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.quality == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore quality cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-quality-${{ runner.os }}-22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        if: needs.scope.outputs.dependencies == 'true'
        # pnpm 9 still calls npm's retired quick/full audit endpoints. Execute pnpm 11 only for
        # this isolated read while keeping the project's package manager pinned at 9.12.0.
        run: pnpm dlx pnpm@11.13.0 --pm-on-fail=ignore audit --prod --audit-level=high

      # A Pi bundle pin may not merge before its artifact is published. The guard HEADs the object
      # with the S3 SDK (the bucket is never public) and skips gracefully while the pin is still the
      # placeholder sha or the credentials are absent, so this lands before the first real publish.
      - name: Check the pinned Pi bundle artifact exists
        env:
          S3_ENDPOINT: ${{ secrets.PI_BUNDLE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.PI_BUNDLE_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.PI_BUNDLE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PI_BUNDLE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_PI_BUNDLES: ${{ vars.PI_BUNDLE_S3_BUCKET }}
          S3_FORCE_PATH_STYLE: ${{ vars.PI_BUNDLE_S3_FORCE_PATH_STYLE }}
        run: pnpm pi-bundle:check

      - name: Test anti-slop integration
        run: pnpm test:anti-slop

      - name: Run anti-slop on changed files
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
        env:
          ANTI_SLOP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: pnpm lint:anti-slop -- --base "$ANTI_SLOP_BASE_SHA"

      - name: Run full quality checks
        run: pnpm ci:quality --output-logs=errors-only

  application-build:
    name: Application Build
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.build == 'true'
    timeout-minutes: 15
    env:
      COMPANION_API_URL: http://127.0.0.1:13301
      COMPANION_WEB_URL: http://127.0.0.1:13300
      BETTER_AUTH_URL: http://127.0.0.1:13301
      NEXT_PUBLIC_COMPANION_API_URL: http://127.0.0.1:13301
      NEXT_PUBLIC_COMPANION_API_BASE: http://127.0.0.1:13300/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore application build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-build-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-build-${{ runner.os }}-22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm exec turbo run build --output-logs=errors-only

      # The build regenerates the committed `companion-agent-client.mjs` bundle, which inlines
      # `@companion/contracts`. Checking the integrity baseline here catches a commit that changed a
      # bundle input without refreshing the artifact; otherwise the first failure is the built API
      # refusing to serve the bundled skill during the RSC smoke (THE-363).
      - name: Verify bundled Companion skill artifact is current
        run: pnpm --filter @companion/companion-skill check:integrity

      - name: Smoke CLI
        run: |
          node cli/dist/index.js --version
          node cli/dist/index.js skills --help

  database-integration:
    name: Database Integration
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.database == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create separate NOBYPASSRLS application database roles
        run: bash scripts/ci-create-db-roles.sh

      - name: Build API
        run: pnpm --filter @companion/api build

      - name: Apply migrations and runtime grants
        run: pnpm --filter @companion/api migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

      - name: Test tenant, Skills, labels, secrets, and RLS
        run: pnpm test:integration
        env:
          COMPANION_SECRETS_MASTER_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=

      - name: Start API and smoke test
        run: |
          DATABASE_URL="$DATABASE_API_URL" \
          COMPANION_API_PORT=18081 \
          BETTER_AUTH_SECRET=ci-api-smoke-better-auth-secret-with-enough-entropy-for-tests \
          BETTER_AUTH_URL=http://127.0.0.1:18081 \
          COMPANION_API_URL=http://127.0.0.1:18081 \
          bash scripts/dev-process.sh api node apps/api/dist/index.js &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          bash scripts/ci-api-smoke.sh
        env:
          COMPANION_API_URL: http://127.0.0.1:18081

  railway-containers:
    name: Railway Containers
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.containers == 'true'
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create separate NOBYPASSRLS application database roles
        run: bash scripts/ci-create-db-roles.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/railway/Dockerfile.backend
          build-args: RAILWAY_SERVICE_NAME=api
          tags: companion-api:ci
          load: true
          cache-from: type=gha,scope=railway-api
          cache-to: type=gha,mode=max,scope=railway-api

      - name: Build one-shot release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/railway/Dockerfile.backend
          build-args: RAILWAY_SERVICE_NAME=release
          tags: companion-release:ci
          load: true
          cache-from: |
            type=gha,scope=railway-release
            type=gha,scope=railway-api
          cache-to: type=gha,mode=max,scope=railway-release

      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/railway/Dockerfile.backend
          build-args: RAILWAY_SERVICE_NAME=worker
          tags: companion-worker:ci
          load: true
          cache-from: type=gha,scope=railway-worker
          cache-to: type=gha,mode=max,scope=railway-worker

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/railway/Dockerfile.backend
          build-args: RAILWAY_SERVICE_NAME=runtime
          tags: companion-runtime:ci
          load: true
          cache-from: type=gha,scope=railway-runtime
          cache-to: type=gha,mode=max,scope=railway-runtime

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/railway/Dockerfile.web
          build-args: |
            COMPANION_API_URL=http://127.0.0.1:18082
            COMPANION_WEB_URL=http://127.0.0.1:18080
            NEXT_PUBLIC_COMPANION_API_BASE=http://127.0.0.1:18080/v1
          tags: companion-web:ci
          load: true
          cache-from: type=gha,scope=railway-web
          cache-to: type=gha,mode=max,scope=railway-web

      - name: Smoke Railway images
        run: bash scripts/ci-container-smoke.sh

  browser:
    name: Browser Critical Flows
    runs-on: ubuntu-latest
    needs: [scope, application-build]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.application-build.result == 'success' &&
      needs.scope.outputs.browser == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_USE_GHA_POSTGRES: "1"
      DATABASE_URL: postgres://companion_api:companion-api@127.0.0.1:5432/companion
      COMPANION_API_URL: http://127.0.0.1:13301
      COMPANION_WEB_URL: http://127.0.0.1:13300
      BETTER_AUTH_URL: http://127.0.0.1:13301
      NEXT_PUBLIC_COMPANION_API_URL: http://127.0.0.1:13301
      NEXT_PUBLIC_COMPANION_API_BASE: http://127.0.0.1:13300/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore application build outputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1-chromium

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create separate NOBYPASSRLS application database roles
        run: bash scripts/ci-create-db-roles.sh

      - name: Hydrate application build outputs
        run: pnpm exec turbo run build --output-logs=errors-only

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Start browser test stack
        run: bash scripts/ci-rsc-smoke.sh start

      - name: RSC smoke
        run: bash scripts/ci-rsc-smoke.sh rsc

      - name: Critical Playwright flows
        run: bash scripts/ci-rsc-smoke.sh e2e

      - name: Stop browser test stack
        if: always()
        run: bash scripts/ci-rsc-smoke.sh stop

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-logs
          path: |
            .context/rsc-smoke/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - scope
      - hygiene
      - apple-quality
      - quality
      - application-build
      - database-integration
      - railway-containers
      - browser
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify required jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
