name: "Publish: Pi Bundle"

# Build and publish the self-hosted Pi bundle: the content-addressed tarball that replaces the
# npm-at-boot install (packages/box-runtime/src/piBundle.ts). The build must run on the Box's Node
# major so native addons in the bundle load on the Box. Publishing is idempotent: the object key is
# the artifact's own sha256, so re-running never overwrites a different artifact.
#
# After a successful run, copy the printed sha256 into COMPANION_PI_BUNDLE.sha256 in piBundle.ts and
# open a PR; the CI artifact guard then confirms the pin resolves to a published object.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/box-runtime/src/piBundle.ts"
      - "scripts/build-pi-bundle.sh"
      - "scripts/upload-pi-bundle.mjs"
      - ".github/workflows/pi-bundle.yml"

permissions:
  contents: read

concurrency:
  group: pi-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Pi bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Read the pinned Node major
        id: node
        run: |
          set -euo pipefail
          major="$(grep -oE 'nodeMajor:[[:space:]]*[0-9]+' packages/box-runtime/src/piBundle.ts \
            | grep -oE '[0-9]+' | head -1)"
          if [ -z "$major" ]; then echo "could not read nodeMajor from piBundle.ts" >&2; exit 1; fi
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.major }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Pi bundle
        id: build
        run: bash scripts/build-pi-bundle.sh

      - name: Publish the Pi bundle to S3
        env:
          S3_ENDPOINT: ${{ secrets.PI_BUNDLE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.PI_BUNDLE_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.PI_BUNDLE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PI_BUNDLE_S3_SECRET_ACCESS_KEY }}
          # Defaults to the skill-archives bucket; PI_BUNDLE_S3_BUCKET stays a dedicated-bucket override.
          S3_BUCKET_PI_BUNDLES: ${{ vars.PI_BUNDLE_S3_BUCKET }}
          S3_FORCE_PATH_STYLE: ${{ vars.PI_BUNDLE_S3_FORCE_PATH_STYLE }}
        run: node scripts/upload-pi-bundle.mjs "${{ steps.build.outputs.tarball }}" "${{ steps.build.outputs.object_key }}"

      - name: Summarize the published pin
        run: |
          {
            echo "### Pi bundle published"
            echo ""
            echo "- object key: \`${{ steps.build.outputs.object_key }}\`"
            echo "- sha256: \`${{ steps.build.outputs.sha256 }}\`"
            echo ""
            echo "Update \`COMPANION_PI_BUNDLE.sha256\` in \`packages/box-runtime/src/piBundle.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"
